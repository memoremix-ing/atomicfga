# The Rust port of Check (see docs/rustcheck.md).
#
#   check/        the evaluator, model compiler and API layer; no storage
#   redb/         redb implementations of the storage interface
#   ffi/          the C ABI atomicfga's Go host links (static library)
#   web/          browser modules (evaluator, redb store) and their JS glue
[workspace]
resolver = "2"
members = ["check", "redb", "ffi", "web/evaluator", "web/redb"]
# The browser modules build for wasm32-unknown-unknown only (make web).
default-members = ["check", "redb", "ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
atomicfga-check = { path = "check" }
atomicfga-redb = { path = "redb" }
redb = "4.4"
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: condition parameters must convert exactly as protobuf's
# float64 values do in Go.
serde_json = { version = "1.0", features = ["float_roundtrip", "raw_value"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Unwinding stays on: the FFI boundary turns a panic into a refusal rather
# than aborting the host process.

# Size-optimized build for the browser modules.
[profile.wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
