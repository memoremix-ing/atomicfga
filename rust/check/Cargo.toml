[package]
name = "atomicfga-check"
description = "Sans-IO port of OpenFGA's Check, model compiler and API layer; storage-free"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

[features]
# Model-based testing against spec/check.qnt, which runs `quint` from PATH:
# run it with the Makefile's test-spec target, which puts the pinned Quint
# there.
spec = []

[dev-dependencies]
quint-connect = "=0.1.2"
anyhow = "1"

[[test]]
name = "quint"
required-features = ["spec"]
