[package]
name = "atomicfga-web"
description = "atomicfga-check as a WebAssembly module whose storage the host provides"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
# Its imports exist only in a WebAssembly host: test it in browsers
# (make test-web), not natively.
test = false
doctest = false

[dependencies]
atomicfga-check.workspace = true
serde_json.workspace = true
